# Galley — default Kubernetes deployment (roadmap #5 slice 6).
#
# Convenience wrapper so `kubectl apply -k deploy/k8s` applies the conservative
# default set (web + proxy + sync, only web exposed, auth OFF). The real
# definitions live in ./base; opt-in overlays compose on top of ./base:
#
#   kubectl apply -k deploy/k8s                          # default (this file)
#   kubectl apply -k deploy/k8s/overlays/compile         # + server compile (sandbox)
#   kubectl apply -k deploy/k8s/overlays/compile-registry# + compile + Universe pkgs
#   kubectl apply -k deploy/k8s/overlays/auth            # + OIDC + closed rooms
#
# Pin the image in ./base/kustomization.yaml (images:). See README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base
