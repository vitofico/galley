# compile-registry component — the compile service WITH Universe package
# resolution enabled (ADR-0016). This is the `compile` component PLUS:
#   - the registry-egress NetworkPolicy (compile → registry host on 443),
#   - an EXAMPLE integrity-manifest ConfigMap mounted at REGISTRY_INTEGRITY_FILE,
#   - a patch on the compile pod that sets REGISTRY_BASE_URL +
#     REGISTRY_INTEGRITY_FILE and **keeps GALLEY_COMPILE_ISOLATION=worker**.
#
# Registry packages run inside the same terminable workers as ordinary compiles.
# Only the operator-pinned registry config crosses the parent/worker boundary.
# Fetch and compile share the hard timeout; inline isolation is not required.
#
# ⚠️ The shipped integrity ConfigMap is an EXAMPLE with placeholder (invalid)
# hashes — every package fails closed until you replace it with a real, reviewed
# manifest. See integrity-configmap.example.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Reuse the sandbox compile component for the Deployment+Service and the web
# GALLEY_COMPILE_URL patch (same exposure requirement applies).
components:
  - ../compile

resources:
  - registry-egress-networkpolicy.yaml
  - integrity-configmap.example.yaml

patches:
  # Switch compile into registry mode: retain worker isolation, add the registry
  # env, and mount the integrity ConfigMap at REGISTRY_INTEGRITY_FILE.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: galley-compile
        namespace: galley
      spec:
        template:
          spec:
            containers:
              - name: compile
                env:
                  - name: GALLEY_COMPILE_ISOLATION
                    value: "worker"
                  # Opt into Universe resolution. Packages STILL fail closed
                  # unless the integrity manifest pins {sha256,size} for them.
                  - name: REGISTRY_BASE_URL
                    value: "https://packages.typst.org"
                  - name: REGISTRY_INTEGRITY_FILE
                    value: "/etc/galley/integrity/universe-integrity.json"
                volumeMounts:
                  - name: integrity
                    mountPath: /etc/galley/integrity
                    readOnly: true
            volumes:
              - name: integrity
                configMap:
                  name: galley-compile-integrity
