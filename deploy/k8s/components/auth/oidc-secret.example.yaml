# EXAMPLE OIDC client Secret — referenced by galley-web via envFrom (14-E).
#
# ⚠️ DO NOT COMMIT REAL SECRETS. The values below are PLACEHOLDERS. Create the
# real Secret out-of-band (never in git) — e.g.:
#
#   kubectl -n galley create secret generic galley-oidc \
#     --from-literal=GALLEY_OIDC_ISSUER=https://auth.example.com/application/o/galley/ \
#     --from-literal=GALLEY_OIDC_CLIENT_ID=galley \
#     --from-literal=GALLEY_OIDC_CLIENT_SECRET='<the real client secret>'
#
# (Galley uses Authorization Code + PKCE; consult docs for the exact env keys your
# build expects.) This manifest is shipped only so `kubectl kustomize` renders a
# complete set and so you can see the shape. If you'd rather not apply a
# placeholder Secret, remove it from components/auth/kustomization.yaml `resources`
# and create the real one with the kubectl command above.
apiVersion: v1
kind: Secret
metadata:
  name: galley-oidc
  namespace: galley
  labels: { app.kubernetes.io/name: galley, app.kubernetes.io/component: web }
type: Opaque
stringData:
  # PLACEHOLDERS — replace with your IdP's real values (or create the Secret
  # out-of-band and delete this file from the overlay).
  GALLEY_OIDC_ISSUER: "https://auth.example.com/application/o/galley/"
  GALLEY_OIDC_CLIENT_ID: "galley"
  GALLEY_OIDC_CLIENT_SECRET: "REPLACE_ME_DO_NOT_COMMIT_A_REAL_SECRET"
