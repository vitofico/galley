# connector component — the OPTIONAL hosted connector (ADR-0033). It needs the
# auth component: connected projects and access tokens belong to accounts.
#
# It does three things, which only work together:
#   1. web:  GALLEY_HOSTED_CONNECTOR=1, so signed-in people can connect a
#            project and create access tokens in Settings;
#   2. sync: a durable volume and GALLEY_SYNC_PERSIST_ROOMS=connector, so the
#            relay keeps a copy of connected projects, and only of those;
#   3. the connector Deployment, Service, Ingress and network rules
#      (connector.yaml).
#
# Enabling this means the server stores connected projects IN PLAIN TEXT on the
# galley-crdt volume. Nothing is stored for a project nobody connected.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - connector.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: galley-web
        namespace: galley
      spec:
        template:
          spec:
            containers:
              - name: web
                env:
                  - name: GALLEY_HOSTED_CONNECTOR
                    value: "1"
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: galley-sync
        namespace: galley
      spec:
        template:
          spec:
            securityContext:
              fsGroup: 1000
            containers:
              - name: sync
                env:
                  - name: GALLEY_SYNC_PERSIST_DIR
                    value: "/var/lib/galley/crdt"
                  - name: GALLEY_SYNC_PERSIST_ROOMS
                    value: "connector"
                volumeMounts:
                  - name: crdt
                    mountPath: /var/lib/galley/crdt
            volumes:
              - name: crdt
                persistentVolumeClaim: { claimName: galley-crdt }
