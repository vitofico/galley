name: Bug report
description: Something doesn't work the way the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security vulnerabilities do not belong here** —
        use private vulnerability reporting (see [SECURITY.md](../blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: Steps to reproduce, expected behavior, actual behavior.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Editor / preview (browser)
        - AI agent loop / providers
        - Collaboration / sync
        - Import / export / citations
        - Self-host (Docker / Kubernetes)
        - Server-side compile
        - MCP / agent interop
        - Other
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: How are you running Galley?
      placeholder: e.g. docker compose up / k8s auth overlay / pnpm dev
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Firefox 140 on macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Console errors / logs
      description: Browser console output or service logs, if relevant.
      render: text
