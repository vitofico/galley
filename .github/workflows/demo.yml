name: Demo

# Publishes the public, no-signup demo to GitHub Pages on every merge to main.
#
# The web app is a COMPLETE Galley on its own: typst.ts compiles in a Web Worker,
# the WASM + fonts are served from the bundle (never a CDN), and the offline Demo
# agent needs no provider or key — so a static host is all this needs. The sync
# relay, model proxy and server-side compile service are opt-in and simply absent
# here; Share surfaces its normal "sharing is unavailable" notice.
#
# Pages serves a PROJECT site from a subpath, so the bundle is built with
# `--base=/galley/`. Everything else in the repo builds at the default base `/`
# and is untouched by this workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so the newest main
# always wins the last word.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy the demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stages the typst WASM + the default font set into public/. Network is
      # available at build (like `pnpm install`); nothing is fetched at runtime.
      - name: Stage the typst WASM + fonts
        run: pnpm --filter @galley/web copy-wasm

      # `exec vite build` rather than the package's `build` script: this passes
      # --base explicitly instead of relying on pnpm's arg-forwarding into a
      # two-command script. The default base stays `/` everywhere else.
      - name: Build the SPA for the /galley/ subpath
        run: pnpm --filter @galley/web exec vite build --base=/galley/

      # Pages has no SPA rewrite: a deep link like /galley/settings is a miss,
      # and Pages answers a miss with 404.html. Serving the app there makes deep
      # links and reloads work (the response carries a 404 status, which no
      # browser surfaces once the app renders).
      - name: Add the SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the bundle
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
