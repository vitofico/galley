name: Release

# Runs on merges to main: enforces the full green-gate, then cuts a CalVer
# release (git tag + GitHub release) and publishes the runtime container image
# to GHCR. Tagging is idempotent — if today's CalVer tag already exists the
# release steps are skipped.

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write # create tags + releases
  packages: write # push images to GHCR

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  green-gate:
    name: Full green-gate (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run the full green-gate (typecheck + unit + web build + e2e)
        # `run`, NOT `up --exit-code-from test`: the `up` form starts every
        # service and aborts the whole stack when the slim `unit` service
        # exits first, killing the e2e container mid-run (SIGTERM/143).
        run: docker compose -f docker-compose.test.yml run --rm --build test

  release:
    name: Tag, release & publish image
    needs: green-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate CalVer version
        id: calver
        run: |
          VERSION="$(node scripts/calver.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated CalVer version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.calver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push git tag
        if: steps.check_tag.outputs.exists == 'false'
        run: node scripts/calver.mjs --tag --push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.calver.outputs.version }}"
          PREV_TAG="$(git tag -l --sort=-v:refname | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sed -n '2p')"
          {
            echo "## Release ${VERSION}"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              echo "First CalVer release of Galley."
              echo ""
              echo "### Changes"
              git log --pretty=format:'- %s (%h)' --no-merges
            else
              echo "### Changes since ${PREV_TAG}"
              git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --no-merges
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        run: gh release create "${{ steps.calver.outputs.version }}" --title "Release ${{ steps.calver.outputs.version }}" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Without an explicit buildx builder, build-push-action falls back to the
      # legacy docker driver, whose GHCR push path intermittently fails with
      # "unknown blob" at manifest time.
      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.calver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:stable
          # The source label is what links the GHCR package to this repository
          # (and makes it appear in the repo's Packages sidebar).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AI-native, local-first, model-agnostic document workspace built on Typst
            org.opencontainers.image.licenses=AGPL-3.0-only
