name: CI

# Feedback on every pull request. Branch iteration uses scripts/check-ci;
# `main` is covered by release.yml. Static checks run on the host; tests use Docker
# because that is the canonical green-gate (host Vitest is intentionally not
# supported — see docker-compose.test.yml).

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  static:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ast-grep structural lint
        run: pnpm lint:ast

      - name: Typecheck
        run: pnpm -r typecheck

  unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    # Preserve the status-check name used by existing branch protection.
    name: Typecheck + unit (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record tested merge tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$GITHUB_SHA" ]]
          tree=$(git rev-parse 'HEAD^{tree}')
          printf '%s\n' "$PR_NUMBER" "$commit" "$tree" > "$RUNNER_TEMP/full-green-gate-tree"

      # Exercise the release gate before merge, including PostgreSQL and Chromium.
      - name: Run the full green-gate
        env:
          CI_CHECK_JUNIT: 1
        run: scripts/check-ci full

      - name: Upload Vitest and Chromium JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-green-gate-junit-${{ github.run_attempt }}
          path: .ci-results/junit/*.xml
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload tested merge tree
        uses: actions/upload-artifact@v7
        with:
          name: full-green-gate-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-green-gate-tree
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-test-results
          path: .ci-results/
          if-no-files-found: ignore

  cross-browser-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    name: Cross-browser smoke (Firefox + WebKit)
    runs-on: ubuntu-latest
    # Cover browser-specific WASM, Web Worker, IndexedDB, and rendering
    # regressions alongside the Chromium green-gate.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Reuse the canonical Playwright test image (chromium + firefox + webkit are
      # all pre-installed in mcr.microsoft.com/playwright:v1.60.0-jammy, the `test`
      # stage). Build the web bundle, then run the firefox+webkit smoke subset.
      # `--entrypoint sh` overrides the image's default green-gate CMD so ONLY the
      # cross-browser script runs here.
      - name: Build bundle + run Firefox/WebKit smoke
        env:
          CI_CHECK_JUNIT: 1
        run: scripts/check-ci cross

      - name: Upload Firefox and WebKit JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-browser-junit-${{ github.run_attempt }}
          path: .ci-results/junit/playwright.xml
          include-hidden-files: true
          if-no-files-found: error

  k8s-manifests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    name: Validate k8s manifests (offline)
    runs-on: ubuntu-latest
    # Pure repo-only check (deploy/k8s + scripts/validate-k8s.sh); isolated from
    # the app green-gate so manifests can't silently rot as features grow (#5 slice 6).
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Single static binary — schema-aware, fully offline validation (the
      # renderer is the kustomize bundled into the runner's kubectl).
      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -sSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate base + every overlay
        run: ./scripts/validate-k8s.sh
